[pytest]
minversion = 7.0
# Repo root on sys.path so tests can do `from cli.cli import ...` (same for other components)
pythonpath = .
testpaths = tests
# importlib mode: test files in different component folders may share basenames
# cov: report coverage for components mentioned in .coveragerc.
addopts = -ra --strict-markers --import-mode=importlib --cov --cov-report=term-missing --cov-report=xml
markers =
    unit: fast, isolated unit tests (no network, Docker or filesystem outside tmp_path)
    integration: tests that need external services (Docker, Airflow, network)
# Tests are never collected from these (Airflow logs/DAG output etc.)
norecursedirs = .git .venv pipeline-orchestration architecture .pytest_cache
